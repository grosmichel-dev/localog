name: 검사

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - run: npm ci

      - name: 변경 경로 판정
        id: changed
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            if git diff --name-only "$BASE" "$HEAD" | grep -Eq '^(content|originals|assets)/'; then
              echo "content=true" >> "$GITHUB_OUTPUT"
            else
              echo "content=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "content=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 운영 문서 확인 (GOVERNANCE · SCREENING_SOP · 원천포맷)
        run: node tools/gate-check.mjs

      - name: 개인정보 검사
        run: node tools/lint-pii.mjs

      # Quartz SPA 라우터는 본문 인라인 <script> 를 재실행하지 않는다.
      # static/*.html 도구 페이지를 data-router-ignore 없이 걸면, 링크로 들어온
      # 사용자에게는 스크립트가 죽은 빈 껍데기가 뜬다 (주소 직접 입력만 정상).
      - name: 정적 도구 페이지 링크에 SPA 라우터 우회가 걸렸는지 확인
        run: |
          set -euo pipefail
          offenders=$(grep -rn 'static/[^)"'"'"' ]*\.html' content --include='*.md' | grep -v 'data-router-ignore' || true)
          if [ -n "$offenders" ]; then
            echo "::error::static/*.html 링크에 data-router-ignore 가 없습니다 — Quartz SPA 라우터가 인라인 스크립트를 실행하지 않아 페이지가 죽습니다"
            echo "$offenders"
            exit 1
          fi
          echo "정적 도구 페이지 링크 확인 완료"

      # record_id 는 doc_id 가 없으면 파일명에서 나온다. 발행된 문서의 이름을 바꾸면
      # 관련근거 연결과 안건 앵커가 함께 끊긴다. aliases 는 옛 주소만 살릴 뿐 record_id 는 못 살린다.
      - name: 발행된 기록문서의 파일명이 바뀌지 않았는지 확인
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "PR 이벤트가 아니므로 건너뜁니다."
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          ALLOW=0
          if printf '%s' "${PR_BODY:-}" | grep -q 'ALLOW-RECORD-RENAME'; then ALLOW=1; fi
          if git log --format=%B "$BASE".."$HEAD" | grep -q 'ALLOW-RECORD-RENAME'; then ALLOW=1; fi

          # content/ 는 전부 한글 경로다. quotePath 를 끄지 않으면 git 이 8진수로 이스케이프해
          # 뒤의 git show 가 파일을 못 찾는다.
          offenders=""
          while IFS=$'\t' read -r status old new; do
            case "$status" in
              R*|D) ;;
              *) continue ;;
            esac
            case "$old" in
              */index.md) continue ;;
              content/*/*/*/*.md) ;;
              *) continue ;;
            esac
            # case 의 * 는 / 도 먹으므로 깊이를 따로 고정한다 (기록문서는 정확히 4단계)
            depth=$(printf '%s' "$old" | awk -F/ '{print NF}')
            [ "$depth" -eq 5 ] || continue
            if git show "$BASE:$old" 2>/dev/null \
              | grep -Eq '^review_status:[[:space:]]*screened([[:space:]]|$)'; then
              offenders="${offenders}${status} ${old}"$'\n'
            fi
          done < <(git -c core.quotePath=false diff --name-status --find-renames "$BASE" "$HEAD" -- content/)

          if [ -n "$offenders" ]; then
            printf '%s' "$offenders"
            if [ "$ALLOW" -eq 1 ]; then
              echo "::warning::발행된 기록문서의 이름이 바뀌었지만 ALLOW-RECORD-RENAME 이 있어 통과시킵니다"
            else
              echo "::error::발행된(screened) 기록문서의 파일명을 바꾸거나 지웠습니다 — record_id 가 파일명에서 나오므로 관련근거 연결과 안건 앵커가 함께 깨집니다. 정말 필요하면 커밋 메시지나 PR 본문에 ALLOW-RECORD-RENAME 을 넣으세요."
              exit 1
            fi
          fi
          echo "기록문서 파일명 확인 완료"

      - name: 데이터 표준 검증
        run: node tools/validate-frontmatter.mjs

      - name: 데이터 표준 검증 (콘텐츠 PR — 공개 서명 필수)
        if: steps.changed.outputs.content == 'true'
        run: node tools/validate-frontmatter.mjs --require-published

      - name: 예산 CSV 검증 (짝 meta·서명·열 존재·고아 CSV)
        run: node tools/validate-budget-csv.mjs --content content --pairs-out /tmp/budget-pairs.json

      - name: 예산 페이지 생성 확인
        run: node tools/build-budget-pages.mjs --content content --pairs-in /tmp/budget-pairs.json --dry-run

      - name: 카탈로그 생성 확인
        run: node tools/build-catalog.mjs --content content --page-out /tmp/catalog.md --data-out /tmp/catalog-data

      - name: 생성물이 저장소에 커밋되지 않았는지 확인
        run: |
          set -euo pipefail
          for f in llms.txt catalog.csv content/_generated/catalog.md; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::$f 가 저장소에 커밋되어 있습니다 — 카탈로그는 사이트 산출물이어야 합니다"
              exit 1
            fi
          done
          echo "생성물 미커밋 확인 완료"

      - name: 자동 생성 문서가 커밋되지 않았는지 확인
        run: |
          set -euo pipefail
          git ls-files content | grep -E '\.md$' > /tmp/tracked-md.txt || true
          : > /tmp/generated-offenders.txt
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if head -n 40 "$f" | grep -qE '^generated:[[:space:]]*true'; then
              echo "$f" >> /tmp/generated-offenders.txt
            fi
          done < /tmp/tracked-md.txt
          if [ -s /tmp/generated-offenders.txt ]; then
            echo "::error::자동 생성 문서가 저장소에 커밋되어 있습니다 — 진본은 CSV 이고 문서는 빌드 산출물입니다"
            cat /tmp/generated-offenders.txt
            exit 1
          fi
          echo "자동 생성 문서 미커밋 확인 완료"

      - name: 콘텐츠 PR 체크리스트 안내
        if: steps.changed.outputs.content == 'true'
        run: |
          echo "::notice::콘텐츠 변경 PR입니다. 병합 전 확인하세요 — 민간인 개인정보 마스킹 서명, 원본/이미지 스크리닝 범위, 제3자 저작물 확인 (docs/SCREENING_SOP.md)"
