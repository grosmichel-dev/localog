name: 사이트 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  PAGES_URL: https://grosmichel-dev.github.io/localog

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: npm 캐시
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Quartz 플러그인 캐시
        uses: actions/cache@v5
        with:
          path: .quartz
          key: ${{ runner.os }}-quartz-${{ hashFiles('quartz.config.yaml') }}
          restore-keys: ${{ runner.os }}-quartz-

      - run: npm ci

      - name: 데이터 표준 검증
        run: node tools/validate-frontmatter.mjs --require-published

      - name: 개인정보 검사
        run: node tools/lint-pii.mjs

      - name: 예산 CSV 검증 (짝 meta·서명·열 존재·고아 CSV)
        run: node tools/validate-budget-csv.mjs --content content --pairs-out .catalog-tmp/budget-pairs.json

      # 카탈로그 생성보다 반드시 먼저 — 순서가 뒤집히면 예산 문서가 catalog.csv/llms.txt 에 빠진다
      - name: 예산 페이지 생성
        run: node tools/build-budget-pages.mjs --content content --pairs-in .catalog-tmp/budget-pairs.json --manifest .catalog-tmp/budget-manifest.json

      - name: 카탈로그 생성 (빌드 전 — 페이지는 임시 콘텐츠 경로로)
        run: node tools/build-catalog.mjs --content content --page-out content/_generated/catalog.md --data-out .catalog-tmp

      - name: Quartz 플러그인 설치
        run: npm run install-plugins

      - name: Quartz 빌드
        run: node ./quartz/bootstrap-cli.mjs build

      - name: 카탈로그 데이터 · 시민용 정적 페이지 복사 (빌드 후 — quartz 가 public 을 비우므로)
        run: |
          set -euo pipefail
          cp .catalog-tmp/llms.txt .catalog-tmp/catalog.csv public/
          mkdir -p public/static
          cp -r static/. public/static/
          # Quartz 는 content/ 만 빌드한다. originals/·assets/ 를 옮기지 않으면
          # 문서 안의 [원본 PDF](originals/…) 링크가 전부 404 가 된다.
          for dir in originals assets; do
            if [ -d "$dir" ] && [ -n "$(ls -A "$dir" 2>/dev/null)" ]; then
              mkdir -p "public/$dir"
              cp -r "$dir/." "public/$dir/"
              echo "$dir 복사 완료"
            fi
          done

      - name: 예산 CSV 다운로드 발행 (검증 통과 쌍만 — 목록 밖 CSV 를 복사하면 서명 없는 원본이 공개된다)
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const pairsFile = ".catalog-tmp/budget-pairs.json";
            if (!fs.existsSync(pairsFile)) { console.log("예산 CSV 없음"); process.exit(0); }
            const pairs = JSON.parse(fs.readFileSync(pairsFile, "utf8"));
            const contentRoot = path.resolve("content");
            for (const pair of pairs) {
              const rel = path.relative(contentRoot, path.resolve(pair.csv));
              const target = path.join("public", rel);
              if (fs.existsSync(target)) { console.log("이미 발행됨 " + rel); continue; }
              fs.mkdirSync(path.dirname(target), { recursive: true });
              fs.copyFileSync(path.resolve(pair.csv), target);
              console.log("복사 " + rel);
            }
          '

      - name: 산출물 검증
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          [ -f public/llms.txt ] || fail "public/llms.txt 가 없습니다"
          [ -f public/catalog.csv ] || fail "public/catalog.csv 가 없습니다"

          if [ ! -f public/_generated/catalog.html ] && [ ! -f public/_generated/catalog/index.html ]; then
            fail "카탈로그 페이지가 사이트에 생성되지 않았습니다"
          fi

          [ -f public/static/prompt-generator.html ] || fail "질문 생성기 페이지가 사이트에 없습니다"

          node tools/check-published-refs.mjs

          grep -q "source_commit:.*${GITHUB_SHA}" public/llms.txt \
            || fail "llms.txt 의 source_commit 이 이번 커밋(${GITHUB_SHA})과 다릅니다"

          head -1 public/catalog.csv | grep -q "source_commit" \
            || fail "catalog.csv 헤더에 source_commit 열이 없습니다"

          if [ "$(wc -l < public/catalog.csv)" -gt 1 ]; then
            grep -q "${GITHUB_SHA}" public/catalog.csv \
              || fail "catalog.csv 데이터 행의 source_commit 이 이번 커밋과 다릅니다"
          fi

          for f in llms.txt catalog.csv content/_generated/catalog.md; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              fail "$f 가 저장소에 커밋되어 있습니다 — 카탈로그는 사이트 산출물이어야 합니다"
            fi
          done

          node -e '
            const fs = require("fs"), path = require("path");
            const manifestFile = ".catalog-tmp/budget-manifest.json";
            const pairsFile = ".catalog-tmp/budget-pairs.json";
            const die = (m) => { console.error("::error::" + m); process.exit(1); };

            if (fs.existsSync(pairsFile)) {
              const contentRoot = path.resolve("content");
              for (const pair of JSON.parse(fs.readFileSync(pairsFile, "utf8"))) {
                const rel = path.relative(contentRoot, path.resolve(pair.csv));
                if (!fs.existsSync(path.join("public", rel))) die("예산 CSV 다운로드가 사이트에 없습니다: " + rel);
              }
            }

            if (!fs.existsSync(manifestFile)) { console.log("예산 페이지 없음 — 건너뜀"); process.exit(0); }
            const generated = JSON.parse(fs.readFileSync(manifestFile, "utf8"));
            if (generated.length === 0) { console.log("예산 페이지 없음 — 건너뜀"); process.exit(0); }

            const catalog = fs.readFileSync("public/catalog.csv", "utf8");
            const missing = [];
            for (const file of generated) {
              const block = /^---\r?\n([\s\S]*?)\r?\n---/m.exec(fs.readFileSync(file, "utf8"));
              const docId = block ? (/^doc_id:\s*(.+)$/m.exec(block[1]) || [])[1] : null;
              if (!docId || !catalog.includes(docId.trim())) missing.push(path.basename(file));
            }
            if (missing.length > 0) {
              die("카탈로그에 빠진 예산 페이지: " + missing.join(", ") + " — 예산 페이지 생성이 카탈로그 생성보다 앞에 있는지 확인하세요");
            }
            console.log("예산 페이지 " + generated.length + "개가 카탈로그에 실림");
          '

          BUDGET_OFFENDERS=$(git ls-files content | grep -E "\.md$" | while IFS= read -r f; do
            head -n 40 "$f" | grep -qE "^generated:[[:space:]]*true" && echo "$f"
          done || true)
          if [ -n "$BUDGET_OFFENDERS" ]; then
            echo "$BUDGET_OFFENDERS"
            fail "자동 생성 문서가 저장소에 커밋되어 있습니다 — 진본은 CSV 이고 문서는 빌드 산출물입니다"
          fi

          echo "산출물 검증 통과"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
